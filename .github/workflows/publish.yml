# Publicar la imagen de este repo.
#
# Todo el trabajo esta en el workflow reutilizable que vive en bit-deploy: el dia que cambie como
# se construye una imagen, se corrige en un lugar y no en tres.

name: publish

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  image:
    uses: IIrola/bit-deploy/.github/workflows/dotnet-image.yml@main
    with:
      solution: Tourism.sln
      image: tourismcore
    permissions:
      contents: read
      packages: write
